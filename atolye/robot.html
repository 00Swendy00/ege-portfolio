<main><h1>Robot Kol Simülatörü</h1><p class="intro">Eklem açılarını değiştir, uç noktayı hedefe taşı ve hareket dizisini oynat.</p><div class="layout scene-layout"><section class="panel"><h2>3D çalışma alanı</h2><div class="viewport" id="scene"></div><p>Sürükleyerek döndür, tekerlekle yakınlaş. <button id="camera">Kamerayı sıfırla</button></p></section><aside class="panel"><h2>Eklem kontrolü</h2><div id="joints"></div><p id="position"></p><h2>Uç nokta hedefi</h2><form id="target"><div class="coordinates"><label>X (mm)<input name="x" type="number" step="any" value="260" required></label><label>Y (mm)<input name="y" type="number" step="any" value="180" required></label><label>Z (mm)<input name="z" type="number" step="any" value="0" required></label></div><button>Hedefe git</button></form><h2>Hareket dizisi</h2><div class="tools"><button id="record">Poz ekle</button><button id="play">Oynat</button><button id="stop">Durdur</button><button id="clear">Diziyi sil</button></div><ol id="poses"></ol><p id="status" role="status"></p></aside></div></main>
